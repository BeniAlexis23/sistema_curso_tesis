services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: curso_investigacion
      MYSQL_USER: ${DB_USER:-curso_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en Dokploy}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en Dokploy}
    volumes:
      - curso_mysql_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${APP_URL:?Configura APP_URL en Dokploy}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-curso_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: curso_investigacion
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en Dokploy}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@undc.edu.pe}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en Dokploy}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-tallertesis.sistemas@undc.edu.pe}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Taller de Tesis - Facultad de Ingeniería <tallertesis.sistemas@undc.edu.pe>}
    volumes:
      - curso_uploads:/app/backend/uploads
    expose:
      - "5000"
    networks:
      - private
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - private
    depends_on:
      backend:
        condition: service_healthy

networks:
  private:
    driver: bridge

volumes:
  curso_mysql_data:
  curso_uploads:
